name: msq

# Production overlay for the LMS product repo. Apply ON TOP of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Mirrors msq-core/docker-compose.prod.yml, which previously had no counterpart
# here. Without this file every LMS service ran in production with NODE_ENV
# unset, which Node and this codebase both read as "development":
#
#   * pino dropped to `debug` level and piped through pino-pretty — unstructured,
#     colour-coded, far more volume than intended, and slower.
#   * Every `if (nodeEnv === 'production')` guard in the codebase silently did
#     nothing. The sharpest example is meta-conversion-api/src/config/index.ts,
#     which refuses to boot when ALLOW_UNSIGNED_WEBHOOKS is enabled in
#     production — a guard that CANNOT FIRE while NODE_ENV is unset, leaving
#     Meta webhook HMAC verification bypassable by an env var.
#   * @platform/auth-constants' requireStrongSecret placeholder/length gate on
#     INTERNAL_SERVICE_SECRET is a no-op outside production.
#
# NODE_ENV is set here rather than in .env so a developer copying .env.example
# cannot accidentally inherit production behaviour locally, and so the setting
# travels with the deploy command that means it.

services:
  leads-service:
    environment:
      NODE_ENV: production

  notifications-service:
    environment:
      NODE_ENV: production

  meta-conversion-api:
    environment:
      # Also re-arms the ALLOW_UNSIGNED_WEBHOOKS refusal described above.
      NODE_ENV: production

  lms-web:
    environment:
      NODE_ENV: production
    # The base file publishes 3001 so the app is reachable directly in local dev.
    # In production every web app sits behind the Caddy reverse proxy, which
    # terminates TLS and is the only thing that should be on the host network.
    #
    # `!override` is REQUIRED: Compose merges sequence fields like `ports` by
    # CONCATENATING them, so a plain `ports: []` is a no-op and the base file's
    # publish survives. Verify with `docker compose config`. Needs Compose v2.24+.
    ports: !override []
